version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: wareach_postgres
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wareach_redis
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wareach_backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/.env:/app/.env
    restart: unless-stopped
    depends_on:
      - db
      - redis
    command: >
      sh -c "npx prisma db push && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wareach_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
