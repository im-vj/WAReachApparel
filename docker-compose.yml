services:
  db:
    image: postgres:15-alpine
    container_name: wareach_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wareach_secure_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-wareach_production}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wareach_redis
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wareach_backend
    ports:
      - "8080:8080"
    environment:
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v25.0}
      DATABASE_URL: ${DATABASE_URL:-postgresql://wareach_secure_user:password@db:5432/wareach_production?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    restart: unless-stopped
    depends_on:
      - db
      - redis
    command: >
      sh -c "npx prisma db push && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wareach_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
